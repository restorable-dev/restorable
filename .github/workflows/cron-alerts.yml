name: Hourly alert cron

# Vercel Hobby crons only run daily, so stale/silent detection is driven from
# here instead: hits the CRON_SECRET-guarded endpoint every hour.
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Invoke /api/cron/alerts
        run: |
          curl -sf --max-time 60 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            https://restorable.dev/api/cron/alerts
