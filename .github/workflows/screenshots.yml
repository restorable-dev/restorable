name: Showcase screenshots

# One-off: boots the retired v0.1 dashboard against a local Supabase stack,
# seeds synthetic data (showcase/seed.py) and screenshots it with Playwright.
# Lives only on the showcase-v01-screenshots branch; the PNGs are committed back
# to that branch under showcase/screenshots/.

on:
  push:
    branches: [showcase-v01-screenshots]
    paths:
      - "showcase/*.py"
      - ".github/workflows/screenshots.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  shoot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: supabase/setup-cli@v2
        with:
          version: 2.117.0

      - name: Start local Supabase
        working-directory: web
        run: supabase start

      - name: Build and start web
        working-directory: web
        run: |
          npm ci
          cp .env.example .env.local
          sed -i 's#^NEXT_PUBLIC_APP_URL=.*#NEXT_PUBLIC_APP_URL=https://restorable.dev#' .env.local
          npm run build
          PORT=3100 CRON_SECRET=local-dev-cron-secret BETA_MODE=1 \
            STRIPE_SECRET_KEY=sk_test_dummy_signature_only npm run start &
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://localhost:3100/login && break
            sleep 1
          done

      - name: Seed synthetic data
        run: |
          ANON_KEY="$(cd web && supabase status -o json | python3 -c 'import json,sys; print(json.load(sys.stdin)["ANON_KEY"])')"
          curl -sf -X POST http://127.0.0.1:54321/auth/v1/signup \
            -H "apikey: $ANON_KEY" -H "Content-Type: application/json" \
            -d '{"email":"demo@restorable.dev","password":"showcase-password-1911"}' > signup.json
          USER_ID="$(python3 -c 'import json; print(json.load(open("signup.json"))["user"]["id"])')"
          python3 showcase/seed.py "$USER_ID" > seed.sql 2> seed.meta
          cat seed.meta
          psql postgresql://postgres:postgres@127.0.0.1:54322/postgres -f seed.sql
          echo "FAIL_RUN=$(sed -n 's/^-- FAIL_RUN=//p' seed.meta)" >> "$GITHUB_ENV"

      - name: Screenshot
        run: |
          pip install playwright
          python3 -m playwright install --with-deps chromium
          python3 showcase/shoot.py http://localhost:3100 demo@restorable.dev showcase-password-1911 "$FAIL_RUN" showcase/screenshots

      - name: Commit screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add showcase/screenshots
          git commit -m "showcase: v0.1 dashboard screenshots (synthetic data)" || exit 0
          git push origin HEAD:showcase-v01-screenshots
