name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  agent:
    name: Agent (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          working-directory: agent

      - name: Test
        run: go test ./...

      - name: Build
        run: go build ./...

  agent-e2e:
    name: Agent e2e (restic fixtures)
    runs-on: ubuntu-latest
    env:
      RESTIC_VERSION: 0.18.0
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum

      - name: Install restic
        run: |
          curl -fsSL -o restic.bz2 \
            "https://github.com/restic/restic/releases/download/v${RESTIC_VERSION}/restic_${RESTIC_VERSION}_linux_amd64.bz2"
          bunzip2 restic.bz2
          chmod +x restic
          sudo mv restic /usr/local/bin/restic
          restic version

      - name: Run e2e (tempdir + files recipe)
        run: agent/e2e/run.sh

      - name: Run e2e (docker + postgres recipe)
        run: agent/e2e/run-docker.sh

  control-plane-e2e:
    name: Control plane e2e (supabase + agent)
    runs-on: ubuntu-latest
    env:
      RESTIC_VERSION: 0.18.0
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: supabase/setup-cli@v2
        with:
          version: latest

      - name: Install restic
        run: |
          curl -fsSL -o restic.bz2 \
            "https://github.com/restic/restic/releases/download/v${RESTIC_VERSION}/restic_${RESTIC_VERSION}_linux_amd64.bz2"
          bunzip2 restic.bz2 && chmod +x restic && sudo mv restic /usr/local/bin/restic

      - name: Start local Supabase
        working-directory: web
        run: supabase start

      - name: Build and start web
        working-directory: web
        run: |
          npm ci
          cp .env.example .env.local
          npm run build
          PORT=3100 \
            TELEGRAM_BOT_TOKEN=e2e-token \
            TELEGRAM_BOT_USERNAME=restorable_alerts_dev_bot \
            TELEGRAM_WEBHOOK_SECRET=local-dev-tg-webhook \
            TELEGRAM_API_BASE=http://127.0.0.1:8181 \
            CRON_SECRET=local-dev-cron-secret \
            STRIPE_SECRET_KEY=sk_test_dummy_signature_only \
            npm run start &
          for i in $(seq 1 30); do
            curl -sf -o /dev/null http://localhost:3100/login && break
            sleep 1
          done

      - name: Run control plane e2e
        run: |
          export SUPABASE_ANON_KEY="$(cd web && supabase status -o json | python3 -c 'import json,sys; print(json.load(sys.stdin)["ANON_KEY"])')"
          web/e2e/run.sh

      - name: Run alerting e2e
        run: |
          export SUPABASE_ANON_KEY="$(cd web && supabase status -o json | python3 -c 'import json,sys; print(json.load(sys.stdin)["ANON_KEY"])')"
          export SUPABASE_SERVICE_ROLE_KEY="$(cd web && supabase status -o json | python3 -c 'import json,sys; print(json.load(sys.stdin)["SERVICE_ROLE_KEY"])')"
          web/e2e/alerts.sh

      - name: Run billing e2e
        run: |
          export SUPABASE_ANON_KEY="$(cd web && supabase status -o json | python3 -c 'import json,sys; print(json.load(sys.stdin)["ANON_KEY"])')"
          web/e2e/billing.sh

      - name: Run telegram-connect e2e
        run: |
          export SUPABASE_ANON_KEY="$(cd web && supabase status -o json | python3 -c 'import json,sys; print(json.load(sys.stdin)["ANON_KEY"])')"
          export SUPABASE_SERVICE_ROLE_KEY="$(cd web && supabase status -o json | python3 -c 'import json,sys; print(json.load(sys.stdin)["SERVICE_ROLE_KEY"])')"
          web/e2e/telegram-connect.sh

  web:
    name: Web (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
