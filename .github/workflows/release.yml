name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Build and publish agent binaries
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum

      - name: Test
        run: go test ./...

      - name: Build binaries
        env:
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          mkdir -p dist
          VERSION="${GITHUB_REF_NAME}"
          COMMIT="${GITHUB_SHA::7}"
          DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          LDFLAGS="-s -w \
            -X github.com/restorable-dev/restorable/agent/cmd.version=${VERSION} \
            -X github.com/restorable-dev/restorable/agent/cmd.commit=${COMMIT} \
            -X github.com/restorable-dev/restorable/agent/cmd.date=${DATE}"
          for platform in linux/amd64 linux/arm64 darwin/arm64; do
            GOOS="${platform%/*}"
            GOARCH="${platform#*/}"
            out="dist/restorable_${VERSION}_${GOOS}_${GOARCH}"
            GOOS="$GOOS" GOARCH="$GOARCH" go build -trimpath -ldflags "$LDFLAGS" -o "$out/restorable" .
            tar -czf "$out.tar.gz" -C "$out" restorable
            rm -r "$out"
          done
          (cd dist && sha256sum *.tar.gz > SHA256SUMS)

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/SHA256SUMS \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
